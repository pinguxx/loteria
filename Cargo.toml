[package]
name = "loteria"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "=0.7.7", features = ["ws"] }
tokio = { version = "=1.40.0", features = ["full"] }
tokio-util = "=0.7.12"
hyper-util = "=0.1.10"
tower-http = { version = "=0.5.2", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
futures-util = "0.3"
